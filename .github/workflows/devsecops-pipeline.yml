name: DevSecOps Pipeline

on:
  push:
  pull_request:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:

  # ============================================================
  # SAST - Ya evidenciado (Fase 1 completada)
  # ============================================================
  # SAST:
  #   runs-on: ubuntu-latest
  #   name: SAST - Static Application Security Testing
  #   steps:
  #     - name: Clonar Repositorio
  #       uses: actions/checkout@v4
  #     - name: Ejecutar Semgrep SAST
  #       uses: returntocorp/semgrep-action@v1
  #       ...

  # ============================================================
  # FASE 2: SCA - Software Composition Analysis
  # ============================================================
  SCA:
    runs-on: ubuntu-latest
    name: SCA - Software Composition Analysis
    steps:

      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Compilar Proyecto
        run: mvn -q -DskipTests -Dspring-javaformat.skip=true package

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          project: 'pet-clinic'
          path: '.'
          format: 'HTML'
          args: >
            --disableCentral
            --failOnCVSS 4

      - name: Subir Reporte Dependency Check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ${{github.workspace}}/reports
