name: DevSecOps Pipeline

on:
  push:
  pull_request:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:

  # ============================================================
  # SAST - Ya evidenciado (Fase 1 completada)
  # ============================================================

  # ============================================================
  # FASE 2: SCA - Software Composition Analysis
  # ============================================================
  SCA:
    runs-on: ubuntu-latest
    name: SCA - Software Composition Analysis
    steps:

      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Descargar Dependencias Maven
        run: mvn dependency:resolve -Dspring-javaformat.skip=true -q

      - name: Ejecutar Trivy SCA - Analisis de Dependencias
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'MEDIUM,HIGH,CRITICAL'
