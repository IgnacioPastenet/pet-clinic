name: DevSecOps Pipeline

on:
  push:
  pull_request:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:

  # ============================================================
  # SAST - Ya evidenciado (Fase 1 completada)
  # SCA  - Ya evidenciado (Fase 2 completada)
  # ============================================================

  # ============================================================
  # FASE 3: Docker Build - Construccion de Imagen
  # FASE 4: Image Security - Analisis de Vulnerabilidades
  # ============================================================
  Docker-Build:
    runs-on: ubuntu-latest
    name: Build - Construccion Imagen Docker
    steps:

      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar Proyecto
        run: |
          mvn -q -DskipTests -Dspring-javaformat.skip=true -Dmaven.gitcommitid.skip=true package
          cp target/spring-petclinic-*.jar spring-petclinic-2.6.0.jar

      - name: Construir Imagen Docker
        run: |
          docker build -t pet-clinic:latest .
          echo "============================================"
          echo "Imagen Docker construida exitosamente"
          echo "============================================"
          docker images pet-clinic:latest

  Image-Security:
    needs: Docker-Build
    runs-on: ubuntu-latest
    name: Image Security - Analisis de Vulnerabilidades
    steps:

      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar y Construir Imagen
        run: |
          mvn -q -DskipTests -Dspring-javaformat.skip=true -Dmaven.gitcommitid.skip=true package
          cp target/spring-petclinic-*.jar spring-petclinic-2.6.0.jar
          docker build -t pet-clinic:latest .

      - name: Trivy - Escaneo de Imagen Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pet-clinic:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'MEDIUM,HIGH,CRITICAL'
