name: DevSecOps Pipeline

on:
  push:
  pull_request:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:

  # ============================================================
  # ETAPA 1 + 2: SAST - Static Application Security Testing
  # ============================================================
  SAST:
    runs-on: ubuntu-latest
    name: SAST - Static Application Security Testing
    steps:

      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Security Gate - SAST (Semgrep CLI)
        run: |
          pip install semgrep
          echo "Ejecutando analisis SAST con Semgrep..."
          echo ""
          
          # Ejecutar Semgrep y capturar resultados
          semgrep scan --config p/java --config p/owasp-top-ten --config p/security-audit \
            --severity ERROR --severity WARNING \
            --json --output semgrep-results.json \
            src/ || true
          
          # Contar vulnerabilidades de severidad MEDIUM+ (WARNING y ERROR en Semgrep)
          total=$(cat semgrep-results.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          results = data.get('results', [])
          count = len([r for r in results if r.get('extra',{}).get('severity','') in ['ERROR','WARNING']])
          print(count)
          ")
          
          echo "============================================"
          echo "Vulnerabilidades encontradas (MEDIUM/HIGH/CRITICAL): $total"
          echo "============================================"
          
          if [ "$total" -gt 0 ]; then
            echo ""
            echo "PIPELINE BLOQUEADO: Se encontraron $total vulnerabilidades de severidad MEDIUM o superior en el codigo."
            echo ""
            cat semgrep-results.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          results = data.get('results', [])
          for r in results:
              sev = r.get('extra',{}).get('severity','')
              if sev in ['ERROR','WARNING']:
                  print(f\"  - [{sev}] {r.get('check_id','')} en {r.get('path','')}:{r.get('start',{}).get('line','')}\")
          "
            exit 1
          else
            echo "Sin vulnerabilidades bloqueantes. Continuando..."
          fi

  # ============================================================
  # ETAPA 3: SCA - Software Composition Analysis
  # ============================================================
  SCA:
    needs: SAST
    runs-on: ubuntu-latest
    name: SCA - Software Composition Analysis
    steps:

      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Descargar Dependencias Maven
        run: mvn dependency:resolve -Dspring-javaformat.skip=true -q

      - name: Ejecutar Trivy SCA - Analisis de Dependencias
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'MEDIUM,HIGH,CRITICAL'

  # ============================================================
  # ETAPA 4: Docker Build - Construccion de Imagen
  # ============================================================
  Docker-Build:
    needs:
      - SAST
      - SCA
    runs-on: ubuntu-latest
    name: Build - Construccion Imagen Docker
    steps:

      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar Proyecto
        run: |
          mvn -q -DskipTests -Dspring-javaformat.skip=true -Dmaven.gitcommitid.skip=true package
          cp target/spring-petclinic-*.jar spring-petclinic-2.6.0.jar

      - name: Construir Imagen Docker
        run: |
          docker build -t pet-clinic:latest .
          echo "============================================"
          echo "Imagen Docker construida exitosamente"
          echo "============================================"
          docker images pet-clinic:latest

  # ============================================================
  # ETAPA 5: Image Security - Analisis de Vulnerabilidades
  # ============================================================
  Image-Security:
    needs: Docker-Build
    runs-on: ubuntu-latest
    name: Image Security - Analisis de Vulnerabilidades
    steps:

      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar y Construir Imagen
        run: |
          mvn -q -DskipTests -Dspring-javaformat.skip=true -Dmaven.gitcommitid.skip=true package
          cp target/spring-petclinic-*.jar spring-petclinic-2.6.0.jar
          docker build -t pet-clinic:latest .

      - name: Trivy - Escaneo de Imagen Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pet-clinic:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'MEDIUM,HIGH,CRITICAL'
