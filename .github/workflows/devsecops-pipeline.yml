name: DevSecOps Pipeline

on:
  push:
  pull_request:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:

  # ============================================================
  # SAST - Ya evidenciado (Fase 1 completada)
  # ============================================================

  # ============================================================
  # FASE 2: SCA - Software Composition Analysis
  # ============================================================
  SCA:
    runs-on: ubuntu-latest
    name: SCA - Software Composition Analysis
    steps:

      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Ejecutar OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:8.4.3:check \
            -Dformat=HTML \
            -DfailBuildOnCVSS=4 \
            -Dspring-javaformat.skip=true \
            -DdisableCentral=true \
            -Denforcer.skip=true

      - name: Subir Reporte Dependency Check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
